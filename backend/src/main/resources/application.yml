server:
  port: 8080

spring:
  application:
    name: coffeelab-backend
  datasource:
    url: jdbc:mysql://${COFFEELAB_DB_HOST:localhost}:${COFFEELAB_DB_PORT:3306}/${COFFEELAB_DB_NAME:coffeelab}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&connectTimeout=1000&socketTimeout=2000
    username: ${COFFEELAB_DB_USER:root}
    password: ${COFFEELAB_DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 1500
      validation-timeout: 1000
      maximum-pool-size: 5
      initialization-fail-timeout: -1

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-handlers-package: com.coffeelab.backend.mybatis
  configuration:
    map-underscore-to-camel-case: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
